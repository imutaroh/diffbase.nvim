name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (nvim ${{ matrix.nvim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.10.4, stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Configure git identity for test repositories
        run: |
          git config --global user.name "diffbase-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Run tests
        run: make test

  stylua:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.4.1
          args: --check lua/ plugin/ tests/
